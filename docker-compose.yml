services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8081}:80"
    environment:
      APP_ENV: development
      ENABLE_TEST_LOGIN: "${ENABLE_TEST_LOGIN:-true}"
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-blog}
      DB_USER: ${POSTGRES_USER:-blog}
      DB_PASS: ${POSTGRES_PASSWORD:-blog_local_password}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blog}
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blog_local_password}
    volumes:
      - blog_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  blog_postgres_data: